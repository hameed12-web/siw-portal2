<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Trainee Enrollment & Registration Portal</title>
    <!-- Tailwind CSS Engine to guarantee styling elements render correctly on Render.com -->
    <script src="https://tailwindcss.com"></script>
    <style>
        body {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="font-sans antialiased text-gray-800 p-4 sm:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
        
        <!-- Header Banner Block matching exact reference formatting -->
        <div class="bg-[#022c22] text-white p-8 text-center border-b-[6px] border-[#cca43b]">
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight uppercase">
                NATIONAL TRAINEE ENROLLMENT & REGISTRATION PORTAL
            </h1>
            <p class="text-sm sm:text-base text-gray-200 font-medium mt-2">
                Official Information Management Intake System — Small Industries Wing, Balochistan Portal
            </p>
        </div>

        <!-- Enrollment Registration Form Structure -->
        <form id="enrollmentForm" action="/submit" method="POST" class="p-6 sm:p-10 space-y-8">
            
            <!-- A. CENTER ALLOCATION DETAILS -->
            <div class="space-y-4">
                <h2 class="text-lg font-bold text-[#064e3b] border-b pb-1 tracking-wide uppercase">
                    A. CENTER ALLOCATION DETAILS
                </h2>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Center / DDO Unit Name *</label>
                    <input type="text" name="center_unit_name" required placeholder="Specify designated training center name" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm bg-gray-50/50 focus:outline-none focus:ring-2 focus:ring-[#064e3b] transition">
                </div>
            </div>

            <!-- B. PERSONAL PROFILE PARTICULARS -->
            <div class="space-y-4">
                <h2 class="text-lg font-bold text-[#064e3b] border-b pb-1 tracking-wide uppercase">
                    B. PERSONAL PROFILE PARTICULARS
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name (As per CNIC) *</label>
                        <input type="text" name="full_name" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm bg-gray-50/50 focus:outline-none focus:ring-2 focus:ring-[#064e3b] transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Father Name *</label>
                        <input type="text" name="father_name" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm bg-gray-50/50 focus:outline-none focus:ring-2 focus:ring-[#064e3b] transition">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">CNIC Number *</label>
                        <input type="text" name="cnic_number" required placeholder="XXXXX-XXXXXXX-X" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm bg-gray-50/50 focus:outline-none focus:ring-2 focus:ring-[#064e3b] transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Mobile Contact Number *</label>
                        <input type="text" name="mobile_contact" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm bg-gray-50/50 focus:outline-none focus:ring-2 focus:ring-[#064e3b] transition">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Session Batch Cohort *</label>
                        <input type="text" name="session_batch" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm bg-gray-50/50 focus:outline-none focus:ring-2 focus:ring-[#064e3b] transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address *</label>
                        <input type="email" name="email_address" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm bg-gray-50/50 focus:outline-none focus:ring-2 focus:ring-[#064e3b] transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Assigned Course Module *</label>
                        <input type="text" name="assigned_course" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm bg-gray-50/50 focus:outline-none focus:ring-2 focus:ring-[#064e3b] transition">
                    </div>
                </div>
            </div>

            <!-- C. STATUS AND DEMOGRAPHICS CLASSIFICATION -->
            <div class="space-y-4">
                <h2 class="text-lg font-bold text-[#064e3b] border-b pb-1 tracking-wide uppercase">
                    C. STATUS AND DEMOGRAPHICS CLASSIFICATION
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Gender Classification *</label>
                        <select name="gender_classification" required class="w-full px-4 py-2.5 border border-gray-300 bg-white rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-[#064e3b] transition">
                            <option value="">-- Choose Option --</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Local Status Residency *</label>
                        <input type="text" name="local_residency" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm bg-gray-50/50 focus:outline-none focus:ring-2 focus:ring-[#064e3b] transition">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Disability Classification</label>
                        <select name="disability_status" class="w-full px-4 py-2.5 border border-gray-300 bg-white rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-[#064e3b] transition">
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Minority Status Identification</label>
                        <select name="minority_status" class="w-full px-4 py-2.5 border border-gray-300 bg-white rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-[#064e3b] transition">
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- D. FINANCIAL DISBURSEMENT ACCOUNTS -->
            <div class="space-y-4">
                <h2 class="text-lg font-bold text-[#064e3b] border-b pb-1 tracking-wide uppercase">
                    D. FINANCIAL DISBURSEMENT ACCOUNTS
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Vendor Identification Number</label>
                        <input type="text" name="vendor_id" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm bg-gray-50/50 focus:outline-none focus:ring-2 focus:ring-[#064e3b] transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Bank Account Number (IBAN)</label>
                        <input type="text" name="bank_iban" placeholder="PKXXBBBBXXXXXXXXXXXXXXXX" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm bg-gray-50/50 focus:outline-none focus:ring-2 focus:ring-[#064e3b] transition">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Monthly Stipend Allowance (Rs.)</label>
                        <input type="text" name="monthly_stipend" placeholder="e.g. 5000" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm bg-gray-50/50 focus:outline-none focus:ring-2 focus:ring-[#064e3b] transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Easypaisa / Omni / Mobi Cash Account Number</label>
