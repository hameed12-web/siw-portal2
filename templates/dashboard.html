<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small Industries Wing, Balochistan - Trainee Portal</title>
    <!-- Core Tailwind CSS Engine CDN Integration with fallback options -->
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <script>
        // Ensure Tailwind config initializes properly even if network constraints limit external components
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: { 850: '#064e3b', 950: '#022c22' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">

    <!-- PUBLIC TRAINEE ENROLLMENT PORTAL VIEW -->
    <div id="publicPortal" class="block max-w-4xl mx-auto my-8 bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
        
        <!-- Header Banner Section (Matches Mockup 2 Banner Branding) -->
        <div class="bg-emerald-950 text-white text-center py-8 px-6 border-b-4 border-amber-500">
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wider uppercase">National Trainee Enrollment & Registration Portal</h1>
            <p class="text-xs sm:text-sm text-amber-400 mt-2 font-medium tracking-wide">
                Official Information Management Intake System — Small Industries Wing, Balochistan
            </p>
        </div>

        <!-- Enrollment Intake Form Context Layout -->
        <form id="enrollmentForm" class="p-6 sm:p-10 space-y-8" onsubmit="handleFormSubmission(event)">
            
            <!-- SECTION A: CENTER ALLOCATION DETAILS -->
            <div>
                <h3 class="text-sm font-bold text-emerald-900 border-b border-gray-200 pb-2 mb-4 tracking-wider uppercase">A. Center Allocation Details</h3>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Center / DDO Unit Name</label>
                    <input type="text" name="center_name" required placeholder="Specify designated training center name" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-emerald-800 focus:outline-none transition">
                </div>
            </div>

            <!-- SECTION B: PERSONAL PROFILE PARTICULARS -->
            <div>
                <h3 class="text-sm font-bold text-emerald-900 border-b border-gray-200 pb-2 mb-4 tracking-wider uppercase">B. Personal Profile Particulars</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Full Name (As per CNIC)</label>
                        <input type="text" name="full_name" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-emerald-800 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Father Name</label>
                        <input type="text" name="father_name" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-emerald-800 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">CNIC Number</label>
                        <input type="text" name="cnic" required placeholder="XXXXX-XXXXXXX-X" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm font-mono focus:ring-2 focus:ring-emerald-800 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Mobile Contact Number</label>
                        <input type="text" name="mobile" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-emerald-800 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Session Batch Cohort</label>
                        <input type="text" name="batch" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-emerald-800 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
                        <input type="email" name="email" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-emerald-800 focus:outline-none transition">
                    </div>
                </div>
                <div class="mt-4">
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Assigned Course Module</label>
                    <input type="text" name="course" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-emerald-800 focus:outline-none transition">
                </div>
            </div>

            <!-- SECTION C: STATUS AND DEMOGRAPHICS CLASSIFICATION -->
            <div>
                <h3 class="text-sm font-bold text-emerald-900 border-b border-gray-200 pb-2 mb-4 tracking-wider uppercase">C. Status and Demographics Classification</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Gender Classification</label>
                        <select name="gender" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm bg-white focus:ring-2 focus:ring-emerald-800 focus:outline-none transition">
                            <option value="">-- Choose Option --</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Local Status Residency</label>
                        <input type="text" name="residency" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-emerald-800 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Disability Classification</label>
                        <select name="disability" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm bg-white focus:ring-2 focus:ring-emerald-800 focus:outline-none transition">
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Minority Status Identification</label>
                        <select name="minority" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm bg-white focus:ring-2 focus:ring-emerald-800 focus:outline-none transition">
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- SECTION D: FINANCIAL DISBURSEMENT ACCOUNTS -->
            <div>
                <h3 class="text-sm font-bold text-emerald-900 border-b border-gray-200 pb-2 mb-4 tracking-wider uppercase">D. Financial Disbursement Accounts</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Vendor Identification Number</label>
                        <input type="text" name="vendor_id" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-emerald-800 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Bank Account Number (IBAN)</label>
                        <input type="text" name="iban" placeholder="PKXXBBBBXXXXXXXXXXXXXXXX" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm font-mono focus:ring-2 focus:ring-emerald-800 focus:outline-none transition">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Monthly Stipend Allowance (Rs.)</label>
                        <input type="number" name="stipend" placeholder="e.g. 5000" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-emerald-800 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Easypaisa / Omni / Mobi Cash Account Number</label>
                        <input type="text" name="mobile_wallet" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-emerald-800 focus:outline-none transition">
                    </div>
                </div>
            </div>
