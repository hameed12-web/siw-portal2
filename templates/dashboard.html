<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Trainee Enrollment & Registration Portal - Small Industries Wing</title>
    <!-- Tailwind CSS Engine for high-density professional presentation -->
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        @import url('https://googleapis.com');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-slate-900 min-h-screen flex flex-col justify-between">

    <!-- ==================== PUBLIC TRAINEE ENROLLMENT PORTAL ==================== -->
    <div id="publicPortalView" class="max-w-4xl mx-auto my-12 w-full px-4 sm:px-6">
        <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200">
            
            <!-- Professional Institutional Header Banner Block -->
            <div class="bg-[#0f4c3a] text-white p-8 sm:p-10 text-center border-b-[5px] border-amber-500">
                <div class="uppercase tracking-widest text-xs font-bold text-amber-400 mb-2">Government of Balochistan</div>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-2">NATIONAL TRAINEE ENROLLMENT & REGISTRATION PORTAL</h1>
                <p class="text-xs sm:text-sm text-gray-300 max-w-2xl mx-auto font-light leading-relaxed">Official Information Management Intake System — Small Industries Wing, Balochistan Portal</p>
            </div>

            <!-- Enrollment Registration Submission Action Intake Form -->
            <form id="traineeEnrollmentForm" onsubmit="handleTraineeSubmit(event)" class="p-8 sm:p-12 space-y-10">
                
                <!-- SECTION A: ALLOCATION DETAILS -->
                <div>
                    <div class="flex items-center gap-3 border-b border-gray-200 pb-2 mb-6">
                        <span class="bg-emerald-50 text-emerald-800 text-xs font-bold px-2 py-1 rounded">A</span>
                        <h2 class="text-sm font-bold tracking-wider text-gray-700 uppercase">Center Allocation Details</h2>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1.5">Center / DDO Unit Name <span class="text-rose-500">*</span></label>
                        <input type="text" required id="center_unit" placeholder="Specify designated training center name" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 focus:outline-none transition placeholder-gray-400 bg-gray-50/50">
                    </div>
                </div>

                <!-- SECTION B: PROFILE PARTICULARS -->
                <div class="space-y-5">
                    <div class="flex items-center gap-3 border-b border-gray-200 pb-2 mb-6">
                        <span class="bg-emerald-50 text-emerald-800 text-xs font-bold px-2 py-1 rounded">B</span>
                        <h2 class="text-sm font-bold tracking-wider text-gray-700 uppercase">Personal Profile Particulars</h2>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Full Name (As per CNIC) <span class="text-rose-500">*</span></label>
                            <input type="text" required id="full_name" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 focus:outline-none transition bg-gray-50/50">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Father Name <span class="text-rose-500">*</span></label>
                            <input type="text" required id="father_name" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 focus:outline-none transition bg-gray-50/50">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">CNIC Number <span class="text-rose-500">*</span></label>
                            <input type="text" required id="cnic" placeholder="XXXXX-XXXXXXX-X" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 focus:outline-none transition bg-gray-50/50">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Mobile Contact Number <span class="text-rose-500">*</span></label>
                            <input type="tel" required id="mobile" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 focus:outline-none transition bg-gray-50/50">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Session Batch Cohort <span class="text-rose-500">*</span></label>
                            <input type="text" required id="batch" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 focus:outline-none transition bg-gray-50/50">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Email Address <span class="text-rose-500">*</span></label>
                            <input type="email" required id="email" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 focus:outline-none transition bg-gray-50/50">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Assigned Course Module <span class="text-rose-500">*</span></label>
                            <input type="text" required id="course" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 focus:outline-none transition bg-gray-50/50">
                        </div>
                    </div>
                </div>

                <!-- SECTION C: DEMOGRAPHICS CLASSIFICATION -->
                <div class="space-y-5">
                    <div class="flex items-center gap-3 border-b border-gray-200 pb-2 mb-6">
                        <span class="bg-emerald-50 text-emerald-800 text-xs font-bold px-2 py-1 rounded">C</span>
                        <h2 class="text-sm font-bold tracking-wider text-gray-700 uppercase">Status and Demographics Classification</h2>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Gender Classification <span class="text-rose-500">*</span></label>
                            <select required id="gender" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 bg-white text-sm focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 focus:outline-none transition">
                                <option value="">-- Choose Option --</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Local Status Residency <span class="text-rose-500">*</span></label>
                            <input type="text" required id="residency" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 focus:outline-none transition bg-gray-50/50">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Disability Classification</label>
                            <select id="disability" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 bg-white text-sm focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 focus:outline-none transition">
                                <option value="No">No</option>
                                <option value="Yes">Yes</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Minority Status Identification</label>
                            <select id="minority" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 bg-white text-sm focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 focus:outline-none transition">
                                <option value="No">No</option>
                                <option value="Yes">Yes</option>
